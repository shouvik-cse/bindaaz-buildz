name: Quality checks

# Runs every test suite on every push and pull request.
# A red ✗ here means: don't merge / fix before the next release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-js:
    name: Unit tests – build engine & worker (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test --experimental-test-coverage "tests/js/*.test.mjs"

  unit-py:
    name: Unit + integration tests – crawler, classifier, page generator (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/py --junitxml=reports/py.xml
      - run: python tests/tools/pycov.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: python-test-report, path: reports/ }

  e2e:
    name: End-to-end tests – real browser, phone/tablet/desktop
    runs-on: ubuntu-latest
    needs: [unit-js, unit-py]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e --junitxml=reports/e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-test-report, path: reports/ }
