name: Update products and deploy to Cloudflare

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC): 06:17, 12:17, 18:17, 00:17 Dhaka time
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r scraper/requirements.txt

      - name: Crawl all shop products
        if: github.event_name != 'push'
        run: python scraper/crawl.py

      - name: Commit catalog.json
        if: github.event_name != 'push'
        run: |
          git config user.name  "bindaaz-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/catalog.json
          git diff --cached --quiet || git commit -m "Update product catalogue [prices]"
          git push

      - name: Build pages (ready builds, price guides, sitemap)
        run: python scraper/build_site.py

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2ffac4a3d6fa72d16813f14a66d9e393
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; exit 1; }
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID} (should be 32)"
          ls dist | head

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2ffac4a3d6fa72d16813f14a66d9e393
        run: npx --yes wrangler@4 pages deploy dist --project-name=bindaaz-buildz --branch=main --commit-dirty=true
