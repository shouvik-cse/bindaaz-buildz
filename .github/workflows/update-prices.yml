name: Update products

# Collects every product from the shops and saves site/catalog.json.
# Cloudflare Pages is connected to this repository, so each saved update
# makes Cloudflare rebuild and publish the site by itself. No tokens needed.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC): 06:17, 12:17, 18:17, 00:17 Dhaka time
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Crawl all shop products
        run: python scraper/crawl.py

      - name: Save catalog.json
        run: |
          git config user.name  "bindaaz-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/catalog.json
          git diff --cached --quiet || git commit -m "Update product catalogue"
          git pull --rebase
          git push
